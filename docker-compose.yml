services:

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hqg_net

  # ── FastAPI backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./hqg-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
      --log-level info
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - reports_data:/tmp/hqg-reports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - hqg_net

  # ── Celery worker ───────────────────────────────────────────────────
  worker:
    build:
      context: ./hqg-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A backend.celery_app.celery_app worker
      --loglevel=info
      --concurrency=2
      -Q queue_default,queue_scan_manager,queue_discovery,queue_crawler,queue_payload,queue_detection,queue_cve_intelligence,queue_template,queue_ai,queue_reporting,queue_scheduler
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - reports_data:/tmp/hqg-reports
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - hqg_net

  # ── React frontend (nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hqg_net

networks:
  hqg_net:
    driver: bridge

volumes:
  redis_data:
    driver: local
  reports_data:
    driver: local
