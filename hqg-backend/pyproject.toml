[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hqg-backend"
version = "0.1.0"
description = "HQG Web Security Platform backend skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=3.2.0,<4.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "python-Wappalyzer>=0.3.1",
  "dnspython>=2.6.1",
  "SQLAlchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "elasticsearch>=8.14.0",
  "pydantic-settings>=2.4.0",
  "weasyprint>=62.0",
]

[tool.uv]
package = false
